<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Battle Map</title>
  <!-- Resolve the bare specifiers the GPU FX compositor imports at runtime.
       pixi-filters itself does `import … from "pixi.js"`, which only an import
       map can satisfy in a browser. Pinned, exact ESM (.mjs) builds, verified
       resolvable. This map affects THIS page only — other pages (3-D dice) are
       untouched. If the CDN/map/WebGL fails, effects.js stays on canvas-2D. -->
  <script type="importmap">
  {
    "imports": {
      "pixi.js": "https://cdn.jsdelivr.net/npm/pixi.js@8.5.2/dist/pixi.min.mjs",
      "pixi-filters": "https://cdn.jsdelivr.net/npm/pixi-filters@6.1.4/dist/pixi-filters.mjs"
    }
  }
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/characters.css" />
  <link rel="stylesheet" href="./css/vtt.css" />
</head>
<body>
  <header class="site" id="site-header"></header>
  <div id="banner-slot"></div>
  <main id="main" class="vtt-main"></main>
  <footer class="site">Forged with dice · hosted on GitHub Pages · data guarded by Supabase<br>
  Game content from the <em>SRD 5.1</em> by Wizards of the Coast LLC, licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/" rel="noopener" target="_blank" style="color:inherit">CC-BY-4.0</a>.</footer>
  <script type="module" src="./js/pages/vtt.js"></script>
</body>
</html>
